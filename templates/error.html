<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} — ModelMarkt</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .error-page {
            text-align: center;
            padding: 80px 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 16px;
            color: #e2e8f0;
        }
        .error-message {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 500px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">MM</span> ModelMarkt
        </div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/map">Карта</a>
            <a href="/premium">Премиум</a>
        </div>
    </nav>

    <main class="container">
        <div class="error-page">
            <div class="error-icon">
                {% if error_code == 404 %}🔍{% else %}⚠️{% endif %}
            </div>
            <div class="error-code">{{ error_code }}</div>
            <h1 class="error-title">{{ error_title }}</h1>
            <p class="error-message">{{ error_message }}</p>
            <a href="/" class="btn btn-primary">← Вернуться на главную</a>
        </div>
    </main>
</body>
</html>
