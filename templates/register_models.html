<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register 3D Models</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: #f1f5f9; padding: 40px; }
        .btn { padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 10px 0; }
        .btn:hover { background: #4f46e5; }
        .result { background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; white-space: pre-wrap; }
        h1 { color: #6366f1; }
    </style>
</head>
<body>
    <h1>Register Existing 3D Models</h1>
    <p>Click the button to register STL and STEP files in uploads/ folder:</p>
    <button class="btn" onclick="registerModels()">REGISTER MODELS</button>
    <div id="result" class="result" style="display:none;"></div>

    <script>
        async function registerModels() {
            const btn = document.querySelector('.btn');
            btn.textContent = 'Registering...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:5000/api/models/register-existing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                
                const div = document.getElementById('result');
                div.style.display = 'block';
                div.textContent = JSON.stringify(data, null, 2);
                
                btn.textContent = 'Done!';
            } catch (err) {
                const div = document.getElementById('result');
                div.style.display = 'block';
                div.textContent = 'ERROR: ' + err.message;
                btn.textContent = 'Error';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
